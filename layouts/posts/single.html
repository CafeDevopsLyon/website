{{ partial "header.html" .}}

    <!-- Page Header -->
    <!-- Set your background image for this header on the line below. -->
    <header class="masthead">
    </header>

    <!-- Post Content -->
    <article>
        <div class="container">
          <div class="post-heading text-center">
            <h1>{{ .Title }}</h1>
          </div>
            <div class="lead row">
              <!-- <h4>Support en format PDF: <a href="{{ .File }}" target="_blank">Link</a></h4> -->
              <div class="lead col-lg-8 offset-lg-2 col-md-10 offset-md-1">
                <br>
                <h4>Speakers:</h4>
                {{- range .Params.Speakers }}
                  {{- with $.Site.GetPage "taxonomyTerm" (printf "speakers/%s" (urlize .)) }}
                    <a href="{{ .Permalink }}">{{ .Params.name }}</a>
                  {{ end }}
                {{ end }}
                  {{ .Content }}
                  {{ partial "comments.html" .}}
                </div>
            </div>
        </div>
    </article>

{{ partial "footer.html" .}}
